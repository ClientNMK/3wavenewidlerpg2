function drawFrame(ctx,a,f){ctx.clearRect(0,0,128,128);ctx.fillStyle='rgba(0,0,0,.06)';ctx.fillRect(0,112,128,16);ctx.drawImage(imgs[a.id],f*128,0,128,128,0,0,128,128);ctx.fillStyle='#c0392b';ctx.fillRect(0,112,128,1);}

 const fig=document.createElement('figure');const c=document.createElement('canvas');c.width=128;c.height=128;const cap=document.createElement('figcaption');cap.textContent=a.label;fig.append(c,cap);document.getElementById('all').appendChild(fig);a.ctx=c.getContext('2d');a.f=0;a.t=0;});
